{% for hobby in site.data.hobbies %}<section class="hobby-section"><div class="hobby-heading"><span class="eyebrow">0{{ forloop.index }}</span><h2>{{ hobby.title[page.lang] }}</h2><p>{{ hobby.description[page.lang] }}</p></div><div class="hobby-gallery">{% for photo in hobby.photos %}<figure><img src="{{ photo.src | relative_url }}" alt="{{ photo.alt[page.lang] | escape }}" width="600" height="450" loading="lazy"></figure>{% endfor %}</div></section>{% endfor %}
