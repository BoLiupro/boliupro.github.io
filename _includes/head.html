<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}Bo Liu</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#852d38">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.lang == 'zh' %}{% assign en_url = page.translation %}{% assign zh_url = page.url %}{% else %}{% assign en_url = page.url %}{% assign zh_url = page.translation %}{% endif %}
{% if page.translation %}<link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}"><link rel="alternate" hreflang="zh-CN" href="{{ zh_url | absolute_url }}"><link rel="alternate" hreflang="x-default" href="{{ en_url | absolute_url }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }} · Bo Liu">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/bo-liu.webp' | absolute_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
