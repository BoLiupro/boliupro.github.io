en:
  title: About Me
  phd_title: PhD Application
  phd_term: Fall 2027
  phd_copy: I am currently exploring PhD opportunities for Fall 2027. I would be grateful for opportunities
    to connect with researchers and discuss potential PhD positions or research collaborations.
  research_title: Research Interests
  research_intro: My research vision centers on agentic intelligence in physical and spatial environments, building on human behavior modeling and LLM-based semantic reasoning.
  slides_label: Download self-introduction
  news_title: News & Updates
  interests:
  - title: Agentic AI
    scope: Core focus
    keywords: Agent Reasoning · Memory · Planning · Multi-Agent Systems
    description: Developing intelligent agents that perceive, reason, and interact in physical and spatial environments.
  - title: Spatial Understanding
    scope: Research direction
    keywords: Multimodal Perception · Structured Representations · Dynamic Environments
    description: Learning structured representations that help agents understand objects, relations, and changes in their surroundings.
  - title: Spatial Intelligence
    scope: Research direction
    keywords: Spatial Reasoning · World Models · Physical Environments
    description: Grounding agent reasoning and decision making in geometry, location, and environmental context.
  - title: Vision-Language Models
    scope: Research direction
    keywords: Multimodal Learning · Visual Reasoning · Vision-Language Alignment
    description: Connecting visual perception with language-guided reasoning to support agent understanding and interaction.
zh:
  title: 关于我
  phd_title: 博士申请
  phd_term: 2027 年秋季
  phd_copy: 我正在寻找 2027 年秋季入学的博士机会。期待与老师和研究者交流博士机会与科研合作。
  research_title: 研究兴趣
  research_intro: 我的研究愿景聚焦物理与空间环境中的智能体智能，并以人类行为建模和大语言模型语义推理为研究基础。
  slides_label: 下载自我介绍
  news_title: 新闻与动态
  interests:
  - title: 智能体人工智能
    scope: 核心方向
    keywords: 智能体推理 · 记忆 · 规划 · 多智能体系统
    description: 构建能够在物理与空间环境中感知、推理和交互的智能体。
  - title: 空间理解
    scope: 研究方向
    keywords: 多模态感知 · 结构化表征 · 动态环境
    description: 学习环境中物体、关系与变化的结构化表征，帮助智能体理解周围世界。
  - title: 空间智能
    scope: 研究方向
    keywords: 空间推理 · 世界模型 · 物理环境
    description: 将智能体的推理与决策建立在几何、位置和环境上下文之上。
  - title: 视觉语言模型
    scope: 研究方向
    keywords: 多模态学习 · 视觉推理 · 视觉语言对齐
    description: 连接视觉感知与语言引导的推理，支持智能体理解环境并与之交互。
