title:
  en: Volunteer Teaching
  zh: 义务支教
period:
  en: September 2024 – June 2025 · Part-time
  zh: 2024.09–2025.06 · 课余兼职支教
school:
  en: Yazhou Primary School, Minhou County, Fuzhou
  zh: 福州市闽侯县亚周小学
description:
  en: From September 2024 to June 2025, I volunteered as a part-time teacher at Yazhou Primary School in Minhou
    County, Fuzhou. I took part in teaching during my spare time alongside my studies. These classroom moments and
    time spent with the children are a meaningful part of my life outside research.
  zh: 2024 年 9 月至 2025 年 6 月，我在福州市闽侯县亚周小学参加义务支教，在学习之余以兼职形式参与教学。与孩子们一起学习、交流的时光，是我研究生活之外一段珍贵的经历。
