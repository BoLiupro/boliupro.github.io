- id: hiking
  title:
    en: Hiking & Travel
    zh: 徒步与旅行
  description:
    en: I enjoy heading outdoors, following a trail, and finding a different view of the world.
    zh: 喜欢走到户外，沿着山路前行，发现生活中的不同风景。
